# Hành Trình Bếp Việt — production on the VPS (same layout as sosuckhoe / snapask).
# Copy to /etc/nginx/sites-available/angi, symlink into sites-enabled, then
# `nginx -t && systemctl reload nginx` and `certbot --nginx -d angi.221-121-1-68.sslip.io`.
# Only dist/ is the web root; server/ and storage/ are reached through the aliases below.

server {
    listen 80;
    listen [::]:80;
    server_name angi.221-121-1-68.sslip.io;

    root /var/www/angi/dist;
    index index.html;

    # Admin photo uploads: up to 15 MB per image, videos a bit more.
    client_max_body_size 64m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # scripts/precompress.mjs writes .gz siblings next to the build assets.
    gzip_static on;

    # SPA: deep links (/mon/<id>, /journey) return the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }

    # Hashed build assets: never fall back to HTML, cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /images/ {
        expires 7d;
        try_files $uri =404;
    }

    # ——— Catalogue API (PHP front controller) ———
    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/angi/server/api/index.php;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        # AI dish recognition takes 10–60 s.
        fastcgi_read_timeout 300;
        fastcgi_param PHP_VALUE "upload_max_filesize=60M
post_max_size=64M
max_execution_time=300
display_errors=Off";
    }

    # Admin SPA (static files only).
    location /admin/ {
        alias /var/www/angi/server/admin/;
        index index.html;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /admin {
        return 301 /admin/;
    }

    # Photos and videos uploaded from the admin. Never executed.
    location /uploads/ {
        alias /var/www/angi/storage/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        location ~ \.(php|phtml|phar|cgi|pl|py)$ {
            deny all;
        }
    }

    location ~ /\. {
        deny all;
    }
}
