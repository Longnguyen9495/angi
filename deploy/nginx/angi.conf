# Ăn gì? — production on the VPS (same layout as sosuckhoe / snapask).
# Copy to /etc/nginx/sites-available/angi, symlink into sites-enabled, then
# `certbot certonly --nginx -d angi.221-121-1-68.sslip.io` (or keep the paths certbot already
# wrote), `nginx -t && systemctl reload nginx`. Before reloading, run
# `sudo -u rexllm php server/bin/check-config.php` — the API refuses to serve an unsafe .env.
# Only dist/ is the web root; server/ and storage/ are reached through the aliases below, so
# server/bin, server/lib, .env, storage/database and the dev scripts have no URL at all.
#
# nginx drops every server-level add_header in a location that adds its own, so each
# location that sets a header includes the full set again (the "# headers" lines).

server {
    listen 80;
    listen [::]:80;
    server_name angi.221-121-1-68.sslip.io;
    # Certbot's HTTP-01 challenge, then everything else moves to HTTPS.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Any other Host name gets nothing (no canonical/OG links built from a forged Host).
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/angi.221-121-1-68.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/angi.221-121-1-68.sslip.io/privkey.pem;
    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name angi.221-121-1-68.sslip.io;

    ssl_certificate /etc/letsencrypt/live/angi.221-121-1-68.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/angi.221-121-1-68.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:angi_ssl:10m;

    root /var/www/angi/dist;
    index index.html;

    # Guest API bodies are small JSON; only the admin upload routes get more (below).
    client_max_body_size 1m;

    # headers
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

    # scripts/precompress.mjs writes .gz siblings next to the build assets.
    gzip_static on;

    # Per-dish link previews: crawlers don't run JS, so /mon/<slug> gets that dish's
    # title/description/image in the HTML head, and /og/<slug>.jpg is its 1200×630 image.
    location ^~ /mon/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/angi/server/web/share.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }
    location ^~ /og/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/angi/server/web/share.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }

    location = /site.webmanifest {
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
    }

    # SPA: deep links (/mon/<id>, /journey) return the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        # headers
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
    }

    # Hashed build assets: never fall back to HTML, cache for a year.
    location /assets/ {
        expires 1y;
        # headers
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location /images/ {
        expires 7d;
        try_files $uri =404;
    }

    # ——— API (PHP front controller): the only PHP file reachable under /api/ ———
    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/angi/server/api/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_read_timeout 60;
        fastcgi_param PHP_VALUE "upload_max_filesize=1M
post_max_size=1M
max_execution_time=60
display_errors=Off
expose_php=Off";
    }
    # Admin photo/video uploads and AI recognition (10–60 s): the only big bodies.
    location ~ ^/api/admin/(dishes/[a-z0-9-]+/(image|video|ai)|dishes/quick|ai/identify)$ {
        client_max_body_size 64m;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/angi/server/api/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_read_timeout 300;
        fastcgi_param PHP_VALUE "upload_max_filesize=60M
post_max_size=64M
max_execution_time=300
display_errors=Off
expose_php=Off";
    }

    # Admin SPA (static files only).
    location /admin/ {
        alias /var/www/angi/server/admin/;
        index index.html;
        # headers
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    }
    location = /admin {
        return 301 /admin/;
    }

    # Photos and videos uploaded from the admin. Never executed, never sniffed as HTML.
    location /uploads/ {
        alias /var/www/angi/storage/uploads/;
        expires 1y;
        disable_symlinks on;
        # headers
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        location ~ \.(php|phtml|phar|cgi|pl|py|sh|html?|svg)$ {
            deny all;
        }
    }

    # Dotfiles (.env, .git, .htaccess) anywhere: 404, except the ACME folder above.
    location ~ /\.(?!well-known/) {
        deny all;
        return 404;
    }
}
