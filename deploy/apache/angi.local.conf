# Ăn gì? — static production build served at http://angi.local
# Included from C:/xampp/apache/conf/extra/httpd-vhosts.conf via IncludeOptional.
# Rebuild with `npm run build`; Apache serves C:/xampp/htdocs/angi/dist directly.

<VirtualHost *:80>
    ServerName angi.local
    DocumentRoot "C:/xampp/htdocs/angi/dist"

    <Directory "C:/xampp/htdocs/angi/dist">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
        # SPA fallback: unknown paths (deep links, refresh) return the app shell.
        FallbackResource /index.html
    </Directory>

    # Hashed build assets: never fall back to HTML, cache for a year.
    # Pre-compressed .br/.gz siblings (scripts/precompress.mjs) are served when
    # the browser accepts them, so mod_deflate can stay off for other vhosts.
    <Directory "C:/xampp/htdocs/angi/dist/assets">
        FallbackResource disabled
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{HTTP:Accept-Encoding} br
            RewriteCond %{REQUEST_FILENAME}.br -f
            RewriteRule ^(.+\.(js|css|json|svg))$ $1.br [L]
            RewriteCond %{HTTP:Accept-Encoding} gzip
            RewriteCond %{REQUEST_FILENAME}.gz -f
            RewriteRule ^(.+\.(js|css|json|svg))$ $1.gz [L]
        </IfModule>
        <FilesMatch "\.js\.(br|gz)$">
            ForceType text/javascript
        </FilesMatch>
        <FilesMatch "\.css\.(br|gz)$">
            ForceType text/css
        </FilesMatch>
        <FilesMatch "\.json\.(br|gz)$">
            ForceType application/json
        </FilesMatch>
        <FilesMatch "\.svg\.(br|gz)$">
            ForceType image/svg+xml
        </FilesMatch>
        <FilesMatch "\.br$">
            Header set Content-Encoding br
            Header append Vary Accept-Encoding
        </FilesMatch>
        <FilesMatch "\.gz$">
            Header set Content-Encoding gzip
            Header append Vary Accept-Encoding
        </FilesMatch>
        <IfModule mod_headers.c>
            Header set Cache-Control "public, max-age=31536000, immutable"
        </IfModule>
    </Directory>

    # ——— Catalogue API + admin (PHP, outside dist/ so builds never wipe them) ———
    Alias /api "C:/xampp/htdocs/angi/server/api"
    <Directory "C:/xampp/htdocs/angi/server/api">
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        FallbackResource /api/index.php
    </Directory>

    Alias /admin "C:/xampp/htdocs/angi/server/admin"
    <Directory "C:/xampp/htdocs/angi/server/admin">
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
        FallbackResource disabled
        <IfModule mod_headers.c>
            Header set Cache-Control "no-cache"
            Header always set X-Frame-Options "DENY"
        </IfModule>
    </Directory>

    # Photos and videos uploaded from the admin. Never execute anything here.
    Alias /uploads "C:/xampp/htdocs/angi/storage/uploads"
    <Directory "C:/xampp/htdocs/angi/storage/uploads">
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
        FallbackResource disabled
        <FilesMatch "\.(php|phtml|phar|cgi|pl|py)$">
            Require all denied
        </FilesMatch>
        <IfModule mod_headers.c>
            Header set Cache-Control "public, max-age=31536000, immutable"
        </IfModule>
    </Directory>

    # Dish photography rarely changes; cache for a week.
    <Directory "C:/xampp/htdocs/angi/dist/images/food-reel">
        <IfModule mod_headers.c>
            Header set Cache-Control "public, max-age=604800"
        </IfModule>
    </Directory>

    <Directory "C:/xampp/htdocs/angi/dist/images">
        FallbackResource disabled
    </Directory>

    <IfModule mod_headers.c>
        <FilesMatch "^index\.html$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set X-Frame-Options "SAMEORIGIN"
    </IfModule>

    # Dotfiles (.env, .git, .htaccess) under any alias: never served.
    <LocationMatch "/\.(?!well-known/)">
        Require all denied
    </LocationMatch>
    # Uploaded files are data: never sniffed or rendered as a page.
    <LocationMatch "^/uploads/">
        <IfModule mod_headers.c>
            Header always set Content-Security-Policy "default-src 'none'; sandbox"
        </IfModule>
    </LocationMatch>

    AddType font/woff2 .woff2
    AddType font/woff .woff

    ErrorLog "logs/angi.local-error.log"
    CustomLog "logs/angi.local-access.log" common
</VirtualHost>
