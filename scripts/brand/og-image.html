<!doctype html>
<!--
  Link-preview image (1200×630) for Facebook, Zalo, Messenger, X…
  Render: open this file in a Chromium browser at exactly 1200×630 (DPR 1),
  screenshot the viewport, save as public/og-image.jpg (JPEG ~85, < 300 KB).
  Uses the app's own fonts and dish photos so the preview matches the site.
-->
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Fraunces';
        font-weight: 100 900;
        src: url('../../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-wght-normal.woff2')
          format('woff2');
        unicode-range: U+0000-00FF;
      }
      @font-face {
        font-family: 'Fraunces';
        font-weight: 100 900;
        src: url('../../node_modules/@fontsource-variable/fraunces/files/fraunces-vietnamese-wght-normal.woff2')
          format('woff2');
        unicode-range:
          U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301,
          U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
      }
      @font-face {
        font-family: 'Be Vietnam Pro';
        font-weight: 400;
        src: url('../../node_modules/@fontsource/be-vietnam-pro/files/be-vietnam-pro-latin-400-normal.woff2')
          format('woff2');
        unicode-range: U+0000-00FF;
      }
      @font-face {
        font-family: 'Be Vietnam Pro';
        font-weight: 400;
        src: url('../../node_modules/@fontsource/be-vietnam-pro/files/be-vietnam-pro-vietnamese-400-normal.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'Be Vietnam Pro';
        font-weight: 600;
        src: url('../../node_modules/@fontsource/be-vietnam-pro/files/be-vietnam-pro-latin-600-normal.woff2')
          format('woff2');
        unicode-range: U+0000-00FF;
      }
      @font-face {
        font-family: 'Be Vietnam Pro';
        font-weight: 600;
        src: url('../../node_modules/@fontsource/be-vietnam-pro/files/be-vietnam-pro-vietnamese-600-normal.woff2')
          format('woff2');
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background:
          radial-gradient(700px 480px at 12% 0%, rgb(201 102 61 / 22%), transparent 70%),
          radial-gradient(600px 420px at 92% 100%, rgb(35 56 44 / 70%), transparent 72%), #0c0c0b;
        color: #f4ede1;
        font-family: 'Be Vietnam Pro', sans-serif;
      }
      .brand {
        position: absolute;
        left: 72px;
        top: 64px;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .brand img {
        width: 60px;
        height: 60px;
        border-radius: 16px;
      }
      .brand b {
        font:
          540 38px/1 'Fraunces',
          serif;
        letter-spacing: -0.01em;
      }
      .brand span {
        font-size: 15px;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: #a9a095;
        margin-left: 4px;
      }
      h1 {
        position: absolute;
        left: 68px;
        top: 180px;
        font:
          460 128px/0.9 'Fraunces',
          serif;
        letter-spacing: -0.035em;
      }
      h1 em {
        display: block;
        font-style: normal;
        color: #d7a85d;
        padding-left: 60px;
      }
      p {
        position: absolute;
        left: 76px;
        bottom: 70px;
        font-size: 25px;
        line-height: 1.45;
        color: #d9d1c4;
        max-width: 540px;
      }
      p strong {
        color: #f4ede1;
        font-weight: 600;
      }
      .plates {
        position: absolute;
        right: -40px;
        top: 0;
        width: 620px;
        height: 630px;
      }
      .plate {
        position: absolute;
        border-radius: 50%;
        overflow: hidden;
        box-shadow: 0 30px 60px -20px rgb(0 0 0 / 80%);
      }
      .plate img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scale(1.22);
      }
      .p1 {
        width: 400px;
        height: 400px;
        left: 110px;
        top: 118px;
        z-index: 3;
      }
      .p2 {
        width: 250px;
        height: 250px;
        left: 20px;
        top: -40px;
        opacity: 0.8;
      }
      .p3 {
        width: 270px;
        height: 270px;
        left: 400px;
        top: 400px;
        opacity: 0.8;
      }
      .p4 {
        width: 200px;
        height: 200px;
        left: 450px;
        top: 40px;
        opacity: 0.55;
      }
      .ring {
        position: absolute;
        left: 90px;
        top: 98px;
        width: 440px;
        height: 440px;
        border-radius: 50%;
        border: 1.5px solid rgb(215 168 93 / 55%);
        z-index: 4;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <img src="../../public/icon-192.png" alt="" /><b>Ăn gì?</b>
    </div>
    <h1>Hôm nay<em>ăn gì?</em></h1>
    <p>
      Quay một vòng, chốt món trong vài giây — rồi
      <strong>tìm quán ngay trên Maps, Grab, ShopeeFood, beFood</strong>.
    </p>
    <div class="plates">
      <div class="plate p2">
        <img src="../../public/images/food-reel/full/001-pho-bo.webp" alt="" />
      </div>
      <div class="plate p4">
        <img src="../../public/images/food-reel/full/022-goi-cuon.webp" alt="" />
      </div>
      <div class="plate p3">
        <img src="../../public/images/food-reel/full/010-bun-bo-hue.webp" alt="" />
      </div>
      <div class="plate p1">
        <img src="../../public/images/food-reel/full/000-com-tam.webp" alt="" />
      </div>
      <div class="ring"></div>
    </div>
  </body>
</html>
