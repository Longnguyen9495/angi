<!doctype html>
<!--
  Background for per-dish link previews (server/web/og-dish-base.png, 1200×630).
  server/web/share.php draws the dish photo (right) and its name (left, y≈250–420)
  on top. Render like og-image.html: 1200×630 viewport, DPR 1, PNG screenshot.
-->
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Fraunces';
        font-weight: 100 900;
        src: url('../../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-wght-normal.woff2')
          format('woff2');
        unicode-range: U+0000-00FF;
      }
      @font-face {
        font-family: 'Fraunces';
        font-weight: 100 900;
        src: url('../../node_modules/@fontsource-variable/fraunces/files/fraunces-vietnamese-wght-normal.woff2')
          format('woff2');
        unicode-range:
          U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301,
          U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
      }
      @font-face {
        font-family: 'Be Vietnam Pro';
        font-weight: 400;
        src: url('../../node_modules/@fontsource/be-vietnam-pro/files/be-vietnam-pro-latin-400-normal.woff2')
          format('woff2');
        unicode-range: U+0000-00FF;
      }
      @font-face {
        font-family: 'Be Vietnam Pro';
        font-weight: 400;
        src: url('../../node_modules/@fontsource/be-vietnam-pro/files/be-vietnam-pro-vietnamese-400-normal.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'Be Vietnam Pro';
        font-weight: 600;
        src: url('../../node_modules/@fontsource/be-vietnam-pro/files/be-vietnam-pro-latin-600-normal.woff2')
          format('woff2');
        unicode-range: U+0000-00FF;
      }
      @font-face {
        font-family: 'Be Vietnam Pro';
        font-weight: 600;
        src: url('../../node_modules/@fontsource/be-vietnam-pro/files/be-vietnam-pro-vietnamese-600-normal.woff2')
          format('woff2');
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background:
          radial-gradient(640px 460px at 10% 0%, rgb(201 102 61 / 22%), transparent 70%),
          radial-gradient(520px 520px at 79% 50%, rgb(244 237 225 / 5%), transparent 70%), #0c0c0b;
        color: #f4ede1;
        font-family: 'Be Vietnam Pro', sans-serif;
      }
      .brand {
        position: absolute;
        left: 72px;
        top: 64px;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .brand img {
        width: 56px;
        height: 56px;
        border-radius: 15px;
      }
      .brand b {
        font:
          540 34px/1 'Fraunces',
          serif;
      }
      .kicker {
        position: absolute;
        left: 74px;
        top: 196px;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: #d7a85d;
      }
      .foot {
        position: absolute;
        left: 74px;
        bottom: 64px;
        font-size: 21px;
        color: #a9a095;
      }
      .foot b {
        color: #f4ede1;
        font-weight: 600;
      }
      .ring {
        position: absolute;
        left: 648px;
        top: 55px;
        width: 520px;
        height: 520px;
        border-radius: 50%;
        border: 1.5px solid rgb(215 168 93 / 50%);
      }
    </style>
  </head>
  <body>
    <div class="brand"><img src="../../public/icon-192.png" alt="" /><b>Ăn gì?</b></div>
    <p class="kicker">Quay món, tìm quán ngay</p>
    <p class="foot">Quay món · <b>tìm quán trong vài giây</b></p>
    <div class="ring"></div>
  </body>
</html>
